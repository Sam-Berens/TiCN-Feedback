<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topics in Cog Neuro Module Evaluation</title>

  <!-- Helper for posting JSON data -->
  <script src="./Assets/PostJson.js"></script>

  <!-- Questions -->
  <script src="./Questions.js"></script>

  <!-- jsPsych core + plugins -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" />

  <style>
    body {
      background: #f7f7fb;
    }

    .container {
      max-width: 820px;
      margin: 40px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .06);
      padding: 24px 28px;
    }

    .title {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      font-weight: 700;
      margin: 0 0 4px;
    }

    .subtitle {
      color: #555;
      margin-top: 0;
    }

    .prompt {
      font-size: 20px;
      margin-bottom: 16px;
    }

    .thanks {
      font-size: 18px;
    }

    .jspsych-content-wrapper {
      max-width: unset;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 class="title">Topics in Cog Neuro Module Evaluation</h1>
    <p class="subtitle">Please answer the questions below. Your responses are anonymous.</p>

    <div id="jspsych-target"></div>
  </div>

  <script>

    // --- Init jsPsych ---
    const jsPsych = initJsPsych({ display_element: 'jspsych-target' });

    const timeline = [];

    // --- Helper: build a slider trial from a rating question ---
    function buildRatingTrial(q, idx) {
      const n = q.RespOpts.length;
      return {
        type: jsPsychHtmlSliderResponse,
        stimulus: () => `<div class="prompt">${q.Prompt}</div>`,
        require_movement: true,
        labels: q.RespOpts,
        min: 1,
        max: 100,
        step: 1,
        slider_width: 600,
        data: {
          question_type: 'rating',
          question_index: idx,
          prompt: q.Prompt,
          options: q.RespOpts
        },
        on_finish: (data) => {
          const i = Math.round(data.response) - 1; // 0-based index into RespOpts
          data.response_index = i;
          data.response_label = q.RespOpts[i];
        }
      }
    }

    // --- Welcome screen ---
    timeline.push({
      type: jsPsychHtmlButtonResponse,
      stimulus: `<p>Welcome! This short evaluation will really help us improve the module.</p>
                 <p>Click <strong>Begin</strong> to start.</p>`,
      choices: ['Begin']
    });

    // --- Add all rating questions ---
    if (Array.isArray(RatingQuestions)) {
      RatingQuestions.forEach((q, i) => timeline.push(buildRatingTrial(q, i)));
    }

    // --- Free-text questions (asked together) ---
    if (Array.isArray(FreetextQuestions) && FreetextQuestions.length > 0) {
      const surveyQs = FreetextQuestions.map((p, i) => ({
        prompt: p,
        rows: 5,
        columns: 70,
        name: `freetext_${i}`
      }));

      timeline.push({
        type: jsPsychSurveyText,
        preamble: '<div class="prompt">A few final open questions:</div>',
        questions: surveyQs,
        data: { question_type: 'freetext', prompts: FreetextQuestions },
        on_finish: (data) => {
          // Flatten answers to top-level keys for convenience
          try {
            const responses = JSON.parse(data.response || '{}');
            Object.keys(responses).forEach(k => { data[k] = responses[k]; });
          } catch (e) { }
        }
      });
    }

    // --- Submit + save ---
    timeline.push({
      type: jsPsychHtmlButtonResponse,
      stimulus: '<p class="thanks">Thanks for completing the evaluation. Click <strong>Submit</strong> to download your responses.</p>',
      choices: ['Submit'],
      on_finish: () => {
        var data = {};
        data.json = JSON.stringify(jsPsych.data.get());
        PostJson('./WriteData.php', data);
      }
    });

    // --- Run ---
    jsPsych.run(timeline);
  </script>
</body>

</html>
